name: adaptive_learning_app
description: Aplikasi Mobile Platform Pembelajaran Adaptif Berbasis Knowledge Graph dan IRT
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  google_fonts: ^9.0.0

  # Navigation
  go_router: ^18.0.2

  # Network & API
  http: ^1.1.2

  # Local Storage
  shared_preferences: ^2.5.6

  # Charts & Analytics
  fl_chart: ^1.2.0

  # Notifications
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.0
  flutter_riverpod: ^3.4.3
  supabase_flutter: ^2.18.3
  equatable: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
